<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0f0f0f;overflow:hidden;font-family:Arial;}
#game{width:100vw;height:100vh;background:linear-gradient(#1a0a00,#2a1500 60%,#000);position:relative;}
#player{position:absolute;bottom:90px;left:50px;width:75px;height:75px;z-index:10;transition:bottom 0.25s, left 0.1s; }
#player img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 8px #ff0000);}
#player.attacking{transform:translateX(20px) scale(1.3) rotate(-10deg);}
#player.jumping img{transform:translateY(-10px) scale(1.1);}
#hp{position:absolute;top:12px;left:10px;background:#000;color:#ff6a00;padding:8px 18px;border:3px solid #ff6a00;border-radius:20px;font-weight:900;}
#ult{position:absolute;top:12px;right:10px;background:linear-gradient(#ff6a00,#ff0000);color:#fff;padding:8px 18px;border-radius:20px;border:3px solid #fff;font-weight:900;}
#controls{position:absolute;bottom:12px;width:100%;display:flex;justify-content:space-between;padding:0 12px;box-sizing:border-box;z-index:20;}
.btn{width:62px;height:62px;background:#000;border:3px solid #ff6a00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 0 12px currentColor;}
.btn:active{transform:scale(0.85);}
#swordBtn{border-color:#00d4ff;color:#00d4ff;} #jumpBtn{border-color:#ffe600;color:#ffe600;} #ultBtn{border-color:#ff1493;color:#ff1493;width:70px;height:70px;}
.enemy{position:absolute;bottom:90px;font-size:40px;z-index:5;}
.slash{position:absolute;bottom:105px;font-size:45px;z-index:15;pointer-events:none;text-shadow:0 0 15px #00d4ff;}
</style>
</head>
<body>
<div id="game">
<div id="hp">HP: 100 | KILL: 0</div>
<div id="ult">ULT: READY!</div>
<div id="player"><img src="dante.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"></div>
<div id="controls">
<div style="display:flex;gap:10px;"><div class="btn" id="leftBtn">◀️</div><div class="btn" id="rightBtn">▶️</div></div>
<div style="display:flex;gap:10px;"><div class="btn" id="swordBtn">⚔️</div><div class="btn" id="jumpBtn">⤴️</div><div class="btn" id="gunBtn">🔫</div><div class="btn" id="ultBtn">💥</div></div>
</div>
</div>
<script>
let x=50,hp=100,kills=0,ult=100,jump=false;
let p=document.getElementById('player'),hpEl=document.getElementById('hp'),ultEl=document.getElementById('ult'),game=document.getElementById('game');
function ui(){hpEl.innerText=`HP: ${hp} | KILL: ${kills}`;ultEl.innerText=ult>=100?'ULT: READY!':`ULT: ${ult}%`;}
function move(d){ x=Math.max(0,Math.min(window.innerWidth-90,x+d)); p.style.left=x+'px'; }
document.getElementById('leftBtn').onclick=()=>move(-35);
document.getElementById('rightBtn').onclick=()=>move(35);
document.getElementById('jumpBtn').onclick=()=>{
 if(jump) return; jump=true; p.classList.add('jumping'); p.style.bottom='190px';
 setTimeout(()=>{p.style.bottom='90px';p.classList.remove('jumping');jump=false;},500);
};
document.getElementById('swordBtn').onclick=()=>{
 p.classList.add('attacking'); setTimeout(()=>p.classList.remove('attacking'),250);
 let fx=document.createElement('div'); fx.className='slash'; fx.innerText='💥⚔️'; fx.style.left=(x+60)+'px'; game.appendChild(fx); setTimeout(()=>fx.remove(),200);
 document.querySelectorAll('.enemy').forEach(e=>{ if(Math.abs(parseInt(e.style.left)-x)<130){ e.remove(); kills++; ult=Math.min(100,ult+15); } }); ui();
};
document.getElementById('gunBtn').onclick=()=>{
 let b=document.createElement('div'); b.innerText='💨'; b.style.position='absolute'; b.style.left=(x+60)+'px'; b.style.bottom='115px'; b.style.fontSize='26px'; game.appendChild(b);
 let bx=x+60; let iv=setInterval(()=>{ bx+=30; b.style.left=bx+'px';
  document.querySelectorAll('.enemy').forEach(en=>{ if(Math.abs(parseInt(en.style.left)-bx)<40){ en.remove(); b.remove(); clearInterval(iv); kills++; ult=Math.min(100,ult+10); ui(); } });
  if(bx>window.innerWidth){clearInterval(iv); b.remove();}
 },20);
};
document.getElementById('ultBtn').onclick=()=>{
 if(ult<100) return; ult=0; p.style.transform='scale(1.5)'; p.style.filter='drop-shadow(0 0 25px red)'; game.style.background='radial-gradient(#ff0000,#000)';
 document.querySelectorAll('.enemy').forEach(e=>{e.remove(); kills++;}); setTimeout(()=>{p.style.transform='scale(1)'; p.style.filter='none'; game.style.background='linear-gradient(#1a0a00,#2a1500 60%,#000)';},1300); ui();
};
setInterval(()=>{
 let e=document.createElement('div'); e.className='enemy'; e.innerText=Math.random()>0.5?'🧟':'👹'; let ex=window.innerWidth-30; e.style.left=ex+'px'; game.appendChild(e);
 let mv=setInterval(()=>{ ex-=6; e.style.left=ex+'px'; if(ex<x+50 && ex>x-10 && !jump){hp-=10; e.remove(); clearInterval(mv); if(hp<=0){alert('GAME OVER! Kills: '+kills); hp=100;kills=0; document.querySelectorAll('.enemy').forEach(en=>en.remove());} ui();} if(ex<-60){clearInterval(mv); e.remove();}},40);
},1300);
ui();
</script>
</body>
</html>
