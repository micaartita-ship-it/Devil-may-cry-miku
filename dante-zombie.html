<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DANTE ZOMBIE V2 - GUNS & BOSS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;font-family:'Special Elite',monospace;}
body{background:#111;overflow:hidden;}
canvas{display:block;}
#ui{position:fixed;top:0;left:0;width:100%;padding:10px;display:flex;justify-content:space-between;color:#fff;pointer-events:none;z-index:10;background:rgba(0,0,0,0.5);}
#joy{position:fixed;bottom:20px;left:20px;width:130px;height:130px;background:rgba(255,255,255,0.15);border:3px solid #fff;border-radius:50%;z-index:10;}
#stick{position:absolute;width:60px;height:60px;background:#ff0000;border:3px solid #fff;border-radius:50%;left:35px;top:35px;}
#atk{position:fixed;bottom:130px;right:20px;width:90px;height:90px;background:rgba(255,0,0,0.7);border:4px solid #fff;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:28px;color:#fff;font-weight:900;z-index:10;}
#gun{position:fixed;bottom:20px;right:20px;width:90px;height:90px;background:rgba(0,100,255,0.7);border:4px solid #fff;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:28px;color:#fff;font-weight:900;z-index:10;}
</style>
</head>
<body>
<div id="ui"><div>HP: <span id="hp">100</span> | KILL: <span id="kill">0</span> | BOSS: <span id="boss">0/20</span></div><div style="color:#ff0000;">DEVIL TRIGGER: <span id="dt">OFF</span></div></div>
<canvas id="c"></canvas>
<div id="joy"><div id="stick"></div></div>
<div id="atk">⚔️</div>
<div id="gun">🔫</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}resize();window.onresize=resize;
let player={x:0,y:0,hp:100,kills:0,dir:0,attacking:false,atkTime:0,dt:false,dtTime:0};
let zombies=[],bullets=[],joy={x:0,y:0},keys={},bossCount=0;
player.x=W/2;player.y=H/2;

function spawnZombie(isBoss=false){
  let angle=Math.random()*Math.PI*2;
  let r=Math.max(W,H)/2+60;
  let x=W/2+Math.cos(angle)*r;
  let y=H/2+Math.sin(angle)*r;
  if(isBoss){zombies.push({x,y,hp:15,speed:0.8,boss:true});}
  else{zombies.push({x,y,hp:2,speed:0.6+Math.random()*1.8,boss:false});}
}
setInterval(()=>{if(zombies.length<25)spawnZombie();},700);

function shoot(){
  let bx=player.x+Math.cos(player.dir)*30;
  let by=player.y+Math.sin(player.dir)*30;
  bullets.push({x:bx,y:by,vx:Math.cos(player.dir)*12,vy:Math.sin(player.dir)*12,life:60});
}

function update(){
  let mx=joy.x,my=joy.y;
  if(keys.w)my=-1;if(keys.s)my=1;if(keys.a)mx=-1;if(keys.d)mx=1;
  player.x+=mx*(player.dt?8:5);player.y+=my*(player.dt?8:5);
  player.x=Math.max(50,Math.min(W-50,player.x));
  player.y=Math.max(50,Math.min(H-50,player.y));
  if(mx||my)player.dir=Math.atan2(my,mx);

  if(player.attacking){player.atkTime--;if(player.atkTime<=0)player.attacking=false;
    else zombies.forEach((z,i)=>{
      let d=Math.hypot(z.x-player.x,z.y-player.y);
      if(d<(player.dt?150:120)){
        let a=Math.atan2(z.y-player.y,z.x-player.x);
        let diff=Math.abs(a-player.dir);if(diff<1.3||diff>5){
          z.hp-=(player.dt?2:1);
          if(z.hp<=0){zombies.splice(i,1);player.kills++;bossCount++;
            if(bossCount>=20){spawnZombie(true);bossCount=0;}
            else if(Math.random()<0.7)spawnZombie();
            if(player.kills%10===0){player.dt=true;player.dtTime=300;document.getElementById('dt').innerText='ON!';}
          }
          z.x+=Math.cos(a)*25;z.y+=Math.sin(a)*25;
        }
      }
    });
  }
  if(player.dt){player.dtTime--;if(player.dtTime<=0){player.dt=false;document.getElementById('dt').innerText='OFF';}}

  bullets.forEach((b,i)=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    zombies.forEach((z,j)=>{
      if(Math.hypot(b.x-z.x,b.y-z.y)<22){
        z.hp--;b.life=0;
        if(z.hp<=0){zombies.splice(j,1);player.kills++;bossCount++;
          if(bossCount>=20){spawnZombie(true);bossCount=0;}
        }
      }
    });
    if(b.life<=0)bullets.splice(i,1);
  });

  zombies.forEach(z=>{
    let a=Math.atan2(player.y-z.y,player.x-z.x);
    z.x+=Math.cos(a)*z.speed;z.y+=Math.sin(a)*z.speed;
    if(Math.hypot(z.x-player.x,z.y-player.y)<32){
      player.hp-=(z.boss?0.5:0.15);
      if(player.hp<=0){alert('PATAY KA BOSS! KILL: '+player.kills+' - DEVIL MAY CRY!');player.hp=100;player.kills=0;zombies=[];bullets=[];bossCount=0;}
    }
  });

  document.getElementById('hp').innerText=Math.floor(player.hp);
  document.getElementById('kill').innerText=player.kills;
  document.getElementById('boss').innerText=bossCount+'/20';
}

function draw(){
  ctx.fillStyle=player.dt?'#330000':'#222';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#333';for(let i=0;i<W;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let i=0;i<H;i+=50){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}

  bullets.forEach(b=>{ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();});

  zombies.forEach(z=>{
    ctx.save();ctx.translate(z.x,z.y);
    if(z.boss){ctx.fillStyle='#000';ctx.fillRect(-30,-30,60,60);ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();}
    else{ctx.fillStyle='#7bc67e';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#000';ctx.fillRect(-8,-8,4,4);ctx.fillRect(4,-8,4,4);
    ctx.restore();
  });

  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);
  if(player.attacking){
    ctx.fillStyle=player.dt?'rgba(255,0,0,0.9)':'rgba(255,255,255,0.7)';
    ctx.beginPath();ctx.arc(0,0,player.dt?150:110,-0.9,0.9);ctx.lineTo(0,0);ctx.fill();
  }
  ctx.fillStyle=player.dt?'#ff0000':'#cc0000';ctx.fillRect(-20,-20,40,40);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-22,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-5,-24,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-24,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#666';ctx.fillRect(22,-5,player.dt?70:50,10);
  ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}loop();

const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
joyEl.addEventListener('touchstart',e=>{e.preventDefault();});
joyEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  let rect=joyEl.getBoundingClientRect();let t=e.touches[0];
  let x=t.clientX-rect.left-65,y=t.clientY-rect.top-65;
  let d=Math.hypot(x,y);if(d>45){x=x/d*45;y=y/d*45;}
  stick.style.left=(35+x)+'px';stick.style.top=(35+y)+'px';
  joy.x=x/45;joy.y=y/45;
});
joyEl.addEventListener('touchend',()=>{joy.x=0;joy.y=0;stick.style.left='35px';stick.style.top='35px';});
document.getElementById('atk').addEventListener('touchstart',e=>{e.preventDefault();if(!player.attacking){player.attacking=true;player.atkTime=14;}});
document.getElementById('gun').addEventListener('touchstart',e=>{e.preventDefault();shoot();});
document.getElementById('atk').addEventListener('click',()=>{if(!player.attacking){player.attacking=true;player.atkTime=14;}});
document.getElementById('gun').addEventListener('click',()=>{shoot();});
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.code==='Space'){if(!player.attacking){player.attacking=true;player.atkTime=14;}}
  if(e.code==='KeyF'){shoot();}
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
</script>
</body>
  </html>
