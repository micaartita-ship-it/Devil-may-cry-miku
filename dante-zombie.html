<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body { margin:0; background:#1a0f00; overflow:hidden; touch-action:none; font-family:Arial; }
#game { width:100vw; height:100vh; background: linear-gradient(#2a1a00, #0d0600); position:relative; }
#player { position:absolute; bottom:80px; left:50px; font-size:50px; transition: bottom 0.2s; }
#hp { position:absolute; top:10px; left:10px; color:#ff6a00; font-weight:900; background:#000; padding:5px 15px; border:2px solid #ff6a00; border-radius:10px; }
#ult { position:absolute; top:10px; right:10px; color:#fff; font-weight:900; background:linear-gradient(#ff6a00,#ff0000); padding:8px 15px; border-radius:20px; border:2px solid #fff; }
#controls { position:absolute; bottom:10px; width:100%; display:flex; justify-content:space-between; padding:0 20px; box-sizing:border-box; }
.btn { width:70px; height:70px; background:#000; border:3px solid #ff6a00; border-radius:50%; color:#ff6a00; font-weight:900; font-size:20px; box-shadow:0 0 15px #ff6a00; }
.btn:active { background:#ff6a00; color:#000; }
#sword { border-color:#00d4ff; color:#00d4ff; box-shadow:0 0 15px #00d4ff; }
#jump { border-color:#ffe600; color:#ffe600; box-shadow:0 0 15px #ffe600; }
#ultimate { border-color:#ff1493; color:#ff1493; box-shadow:0 0 20px #ff1493; width:80px; height:80px; }
.enemy { position:absolute; bottom:80px; font-size:40px; }
.slash { position:absolute; font-size:30px; color:#00d4ff; font-weight:900; text-shadow:0 0 10px #00d4ff; }
</style>
</head>
<body>
<div id="game">
<div id="hp">HP: 100 | KILL: 0</div>
<div id="ult">ULT: READY!</div>
<div id="player">😎⚔️</div>
<div id="controls">
<div style="display:flex; gap:10px;">
<button class="btn" id="left">◀️</button>
<button class="btn" id="right">▶️</button>
</div>
<div style="display:flex; gap:10px;">
<button class="btn" id="sword">⚔️</button>
<button class="btn" id="jump">⤴️</button>
<button class="btn" id="shoot">🔫</button>
<button class="btn" id="ultimate">💥</button>
</div>
</div>
</div>
<script>
let x=50, y=80, hp=100, kills=0, ultCharge=100, isJumping=false;
let p=document.getElementById('player'), game=document.getElementById('game');
let hpBar=document.getElementById('hp'), ultBar=document.getElementById('ult');

function updateUI(){ hpBar.innerText=`HP: ${hp} | KILL: ${kills}`; ultBar.innerText=ultCharge>=100?'ULT: READY!':`ULT: ${ultCharge}%`; ultBar.style.opacity=ultCharge>=100?'1':'0.5'; }

document.getElementById('left').ontouchstart=()=>{ x-=30; p.style.left=x+'px'; p.innerText='😎⚔️'; }
document.getElementById('right').ontouchstart=()=>{ x+=30; p.style.left=x+'px'; p.innerText='⚔️😎'; }

document.getElementById('jump').onclick=()=>{
 if(isJumping) return; isJumping=true;
 p.style.bottom='180px'; p.innerText='😎⤴️';
 setTimeout(()=>{ p.style.bottom='80px'; isJumping=false; p.innerText='😎⚔️'; },400);
}

document.getElementById('sword').onclick=()=>{
 let s=document.createElement('div'); s.className='slash'; s.innerText='💥⚔️💥';
 s.style.left=(x+60)+'px'; s.style.bottom='90px'; game.appendChild(s);
 // check enemies
 document.querySelectorAll('.enemy').forEach
