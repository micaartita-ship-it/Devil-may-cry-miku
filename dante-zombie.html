<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial Black;touch-action:none}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(180deg,#ff8a2a,#7a2a00 60%,#1a0800);overflow:hidden}
#top{position:absolute;top:0;width:100%;height:52px;display:flex;justify-content:space-between;padding:5px 8px;z-index:999;background:linear-gradient(rgba(0,0,0,0.7),transparent)}

.chibi{width:100%;height:100%;position:relative}

.face{position:absolute;top:26px;left:12px;width:56px;height:44px;background:#ffdfa0;border:3px solid #000;border-radius:50%}
.eye{position:absolute;top:14px;width:11px;height:11px;background:#000;border-radius:50%} .eye:after{content:'';position:absolute;top:2px;left:2px;width:5px;height:5px;background:#0ef;border-radius:50%}
.e1{left:10px} .e2{left:33px}
.coat{position:absolute;top:64px;left:8px;width:64px;height:40px;background:#c00;border:3px solid #000;border-radius:6px}
.sword{position:absolute;top:8px;left:-10px;width:11px;height:68px;background:#ccc;border:2px solid #000;transform:rotate(-30deg)}
#player.atk{transform:translateX(15px) scale(1.1)} #player.atk .sword{transform:rotate(20deg) translateX(20px);background:#0ff;box-shadow:0 0 15px #0ff}
.enemy{position:absolute;bottom:82px;z-index:10;will-change:left}
.zType1{width:62px;height:82px} .zType2{width:54px;height:78px} .zType3{width:78px;height:95px} .zBoss{width:130px;height:160px;z-index:15!important}
.zBody{width:100%;height:100%;position:relative}
#bottom{position:absolute;bottom:6px;width:100%;display:flex;justify-content:space-between;padding:0 10px;z-index:999;align-items:center}
#joy{width:86px;height:86px;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.4);border-radius:50%;position:relative}
#stick{position:absolute;top:50%;left:50%;width:36px;height:36px;background:rgba(255,255,255,0.45);border-radius:50%;transform:translate(-50%,-50%)}
.btn{width:94px;height:46px;border:3px solid #000;border-radius:12px;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #000}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
#dash{background:#0a8aff} #atk{background:#ff1a1a}
.fx{position:absolute;z-index:100;pointer-events:none;font-weight:900;animation:pop 0.6s forwards}
@keyframes pop{to{transform:translateY(-60px);opacity:0}}
#bossHp{position:absolute;top:55px;left:50%;transform:translateX(-50%);width:70%;height:18px;background:#000;border:2px solid #f00;border-radius:10px;display:none;z-index:999;overflow:hidden}
#bossFill{width:100%;height:100%;background:linear-gradient(90deg,#f00,#900)}
</style>
</head>
