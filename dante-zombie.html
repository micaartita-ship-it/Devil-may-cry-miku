<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#top{pointer-events:auto;display:flex;justify-content:space-between;padding:8px;background:linear-gradient(rgba(0,0,0,0.8),transparent);color:#fff;font-family:Arial Black;font-size:14px}
#hpBar{width:100px;height:14px;background:#333;border-radius:8px;display:inline-block;vertical-align:middle;margin:0 6px;overflow:hidden} #hpF{width:85%;height:100%;background:#0f0}
#ult{pointer-events:auto;padding:8px 16px;background:#ff0;border:3px solid #000;border-radius:10px;color:#000;font-weight:900;box-shadow:0 0 15px #ff0}
#bot{position:absolute;bottom:10px;width:100%;display:flex;justify-content:space-between;padding:0 12px;pointer-events:auto}
#joy{width:90px;height:90px;background:rgba(255,255,255,0.2);border:3px solid #fff;border-radius:50%;position:relative}
#stick{position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(255,255,255,0.5);border-radius:50%;transform:translate(-50%,-50%)}
.b{width:100px;height:50px;border:3px solid #000;border-radius:12px;color:#fff;font-family:Arial Black;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 0 #000}
#dash{background:#09f} #atk{background:#f22}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="top"><div>HP <div id="hpBar"><div id="hpF"></div></div> <span id="hpT">85/100</span> 🪙<span id="coin">120</span> | LVL <span id="lvl">1</span></div><div id="ult">ULT READY</div></div>
<div id="bot"><div id="joy"><div id="stick"></div></div><div style="display:flex;gap:10px"><div class="b" id="dash">DASH</div><div class="b" id="atk">ATK</div></div></div>
</div>
<script>
const c=document.getElementById('c'), x=c.getContext('2d');
function resize(){c.width=innerWidth; c.height=innerHeight} resize(); addEventListener('resize',resize);
let px=80, py=0, hp=85, lvl=1, kills=0, ult=100, enemies=[], particles=[];
let keys={};
function drawBG(){
 let g=x.createLinearGradient(0,0,0,c.height);
 g.addColorStop(0,lvl<4?'#ff7a18':lvl<7?'#444':'#300');
 g.addColorStop(1,'#1a0800');
 x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
 // buildings
 x.fillStyle='rgba(0,0,0,0.5)';
 for(let i=0;i<7;i++) x.fillRect(i*c.width/7, c.height-180-Math.random()*60, 60, 180);
 // ground
 x.fillStyle='#3d2010'; x.fillRect(0,c.height-80,c.width,80);
}
function drawPlayer(){
 let y=c.height-80-90;
 x.fillStyle='rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(px+30,y+90,22,6,0,0,7); x.fill();
 // coat
 x.fillStyle='#c00'; x.strokeStyle='#000'; x.lineWidth=3; x.fillRect(px+5,y+35,50,45); x.strokeRect(px+5,y+35,50,45);
 // head
 x.fillStyle='#ffdfa0'; x.beginPath(); x.arc(px+30,y+18,22,0,7); x.fill(); x.stroke();
 // hair
 x.fillStyle='#fff'; x.beginPath(); x.arc(px+30,y+8,30,Math.PI,0); x.fill(); x.stroke();
 // eyes
 x.fillStyle='#000'; x.beginPath(); x.arc(px+20,y+20,5,0,7); x.arc(px+40,y+20,5,0,7); x.fill();
 x.fillStyle='#0ef'; x.beginPath(); x.arc(px+21,y+21,2.5,0,7); x.arc(px+41,y+21,2.5,0,7); x.fill();
 // sword
 x.save(); x.translate(px+45,y+60); x.rotate(-0.6); x.fillStyle='#ccc'; x.fillRect(-4,-5,8,50); x.strokeRect(-4,-5,8,50); x.restore();
}
function drawEnemies(){
 enemies.forEach(e=>{
   let y=c.height-80-e.h;
   // zombie type color
   if(e.type==='walker') x.fillStyle='#4a7';
   if(e.type==='runner') x.fillStyle='#f44';
   if(e.type==='tank') x.fillStyle='#666';
   if(e.type==='boss') x.fillStyle='#a00';
   x.strokeStyle='#000'; x.lineWidth=3;
   x.fillRect(e.x,y,e.w,e.h); x.strokeRect(e.x,y,e.w,e.h);
   // eyes
   x.fillStyle='#ff0'; x.fillRect(e.x+8,y+8,8,8); x.fillRect(e.x+e.w-18,y+8,8,8);
   // boss hp bar
   if(e.type==='boss'){ x.fillStyle='#000'; x.fillRect(e.x,y-14,e.w,8); x.fillStyle='#f00'; x.fillRect(e.x,y-14,e.w*(e.hp/e.maxHp),8); }
 });
}
function update(){
 // move enemies
 enemies.forEach(e=>{ e.x-=e.speed; });
 enemies=enemies.filter(e=>e.x>-100);
 // collide
 enemies.forEach((e,i)=>{
   if(Math.abs(e.x-px)<50 && c.height-80-e.h < c.height-80){
     if(e.type!=='boss'){ hp-=10; enemies.splice(i,1); }
     else{ hp-=1; }
     document.getElementById('hpF').style.width=hp+'%';
     document.getElementById('hpT').innerText=hp+'/100';
     if(hp<=0){ alert('GAME OVER Level:'+lvl+' Kills:'+kills); hp=85; kills=0; lvl=1; enemies=[]; document.getElementById('lvl').innerText=lvl; document.getElementById('hpF').style.width='85%'; document.getElementById('hpT').innerText='85/100'; }
   }
 });
}
function loop(){
 drawBG(); drawEnemies(); drawPlayer(); update();
 requestAnimationFrame(loop);
}
loop();
// SPAWN - SIGURADO MAY KALABAN!
setInterval(()=>{
 if(enemies.filter(e=>e.type==='boss').length>0) return;
 let t='walker';
 if(lvl>=2 && Math.random()<0.4) t='runner';
 if(lvl>=4 && Math.random()<0.3) t='tank';
 if(kills>0 && kills%15===0 && lvl<10) t='boss';
 let e={x:c.width+20, w:t==='tank'?70:t==='boss'?110:55, h:t==='tank'?85:t==='boss'?120:75, speed:t==='runner'?5:t==='tank'?1.5:t==='boss'?1:2.5, type:t, hp:t==='tank'?4:t==='boss'?30:2, maxHp:t==='tank'?4:t==='boss'?30:2};
 enemies.push(e);
}, 900);

// CONTROLS - 100% WORKING
let joy=document.getElementById('joy'), stick=document.getElementById('stick'), active=false, sx=0;
joy.addEventListener('touchstart',e=>{active=true; sx=e.touches[0].clientX; e.preventDefault()},{passive:false});
joy.addEventListener('touchmove',e=>{
 if(!active) return;
 let dx=e.touches[0].clientX-sx;
 stick.style.transform=`translate(calc(-50% + ${Math.max(-30,Math.min(30,dx))}px), -50%)`;
 if(dx<-10) px=Math.max(5,px-7);
 if(dx>10) px=Math.min(c.width-90,px+7);
 e.preventDefault();
},{passive:false});
joy.addEventListener('touchend',()=>{active=false; stick.style.transform='translate(-50%,-50%)'});

function doAtk(){
 let hit=false;
 enemies.forEach((e,i)=>{
   if(Math.abs(e.x-px)<120){
     e.hp--; hit=true;
     if(e.hp<=0){
       enemies.splice(i,1); kills++; ult=Math.min(100,ult+12);
       document.getElementById('coin').innerText=120+kills*5;
       document.getElementById('ult').innerText= ult>=100?'ULT READY':'ULT '+ult+'%';
       if(kills%12===0 && lvl<10){ lvl++; document.getElementById('lvl').innerText=lvl; }
     }
   }
 });
 // slash effect
 x.fillStyle='#0ff'; x.fillRect(px+60,c.height-130,80,6);
 setTimeout(()=>{},100);
}
document.getElementById('atk').addEventListener('touchstart',e=>{e.preventDefault(); doAtk()});
document.getElementById('atk').addEventListener('click',doAtk);
document.getElementById('dash').addEventListener('touchstart',e=>{e.preventDefault(); px+=110; if(px>c.width-90) px=c.width-90;});
document.getElementById('dash').addEventListener('click',()=>{px+=110});
document.getElementById('ult').addEventListener('click',()=>{
 if(ult<100) return; ult=0; document.getElementById('ult').innerText='ULT 0%'; enemies=[]; kills+=5;
});
</script>
</body>
</html>
