<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dante Zombie - Final Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;overflow:hidden;touch-action:none;font-family:Arial Black}
#game{width:100vw;height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#ff8a2a 0%,#cc4a00 35%,#7a2000 70%,#1a0800 100%)}
#top{position:absolute;top:0;width:100%;padding:6px 10px;display:flex;justify-content:space-between;z-index:999;color:#fff;font-size:12px;align-items:center}
#hpBox{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.9);border:2px solid #fff;border-radius:20px;padding:5px 12px}
#hpBar{width:95px;height:12px;background:#222;border-radius:8px;overflow:hidden} #hpF{width:85%;height:100%;background:linear-gradient(90deg,#0f0,#2a2)}
#ult{padding:8px 16px;background:linear-gradient(#ff0,#fa0);border:3px solid #000;border-radius:12px;color:#000;font-weight:900;box-shadow:0 0 18px #ff0}
#ground{position:absolute;bottom:0;width:100%;height:82px;background:linear-gradient(#5a2e12,#1a0800);z-index:2}
#player{position:absolute;bottom:82px;left:60px;width:110px;height:110px;z-index:20;transition:left 0.08s}
#player img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(2px 3px 0 #000)}
#player.running{animation:run 0.16s infinite alternate}
@keyframes run{0%{transform:translateY(0) scaleX(1)}100%{transform:translateY(-6px) scaleX(1.05)}}
#player.atk{animation:atk 0.28s forwards}
@keyframes atk{0%{transform:translateX(0)}30%{transform:translateX(28px) scale(1.25)}100%{transform:translateX(0)}}
.enemy{position:absolute;bottom:82px;z-index:15;will-change:left;animation:zRun 0.25s infinite alternate}
@keyframes zRun{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}
#bot{position:absolute;bottom:10px;width:100%;display:flex;justify-content:space-between;padding:0 12px;z-index:999;align-items:center}
#joy{width:90px;height:90px;background:rgba(255,255,255,0.18);border:3px solid #fff;border-radius:50%;position:relative}
#stick{position:absolute;top:50%;left:50%;width:40px;height:40px;background:rgba(255,255,255,0.6);border-radius:50%;transform:translate(-50%,-50%)}
.btn{width:98px;height:52px;border:3px solid #000;border-radius:14px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 0 #000}
#dash{background:#0af} #atk{background:#f22}
.fx{position:absolute;z-index:100;pointer-events:none;font-weight:900;animation:up 0.6s forwards} @keyframes up{to{transform:translateY(-70px);opacity:0}}
#bossHp{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:70%;height:18px;background:#000;border:3px solid #f00;border-radius:10px;display:none;z-index:999;overflow:hidden} #bossF{width:100%;height:100%;background:linear-gradient(90deg,#f00,#900)}
</style>
</head>
